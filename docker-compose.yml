services:
  studio:
    build:
      context: .
      args:
        NEXT_PUBLIC_DEMO_MODE: "0"
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:?Set the Firebase Web configuration}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:?Set the Firebase Web configuration}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?Set the Firebase Web configuration}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:?Set the Firebase Web configuration}
        NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY: ${NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY:?Set the App Check site key}
    env_file: .env.local
    environment:
      NEXT_PUBLIC_DEMO_MODE: "0"
      AI_PROVIDER: gemini
    ports:
      - "127.0.0.1:3000:3000"
